name: Registered ADB prices
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check device, collect only, or collect and apply validated prices
        type: choice
        options: [inspect, collect, apply, screen, login_prepare]
        default: inspect
        required: true
      evidence_public_key:
        description: RSA public key for encrypted screen diagnostics (screen mode only)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: whisky-adb-registered-prices
  cancel-in-progress: false
jobs:
  prices:
    if: github.ref == 'refs/heads/main' && github.repository == 'bit-O-study/whisky_app'
    runs-on: [self-hosted, Windows, X64, bito-whisky_app]
    timeout-minutes: 115
    env:
      ADB_SERIAL: R39N505CG5Z
      WHISKY_ENV_FILE: C:/services/Bit-O/whisky_app/config/runtime.env
      PRICE_MODE: ${{ inputs.mode }}
      EVIDENCE_PUBLIC_KEY: ${{ inputs.evidence_public_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing daemon and prepare official ADB client
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $client = New-Object Net.Sockets.TcpClient
          try { $client.Connect('127.0.0.1',5037) } finally { $client.Dispose() }
          if (-not (Test-Path -LiteralPath $env:WHISKY_ENV_FILE)) { throw 'Whisky runtime environment is inaccessible' }
          $sdk = Join-Path $env:RUNNER_TEMP 'whisky-platform-tools'
          $adb = Join-Path $sdk 'platform-tools/adb.exe'
          if (-not (Test-Path -LiteralPath $adb)) {
            New-Item -ItemType Directory -Path $sdk -Force | Out-Null
            $archive = Join-Path $sdk 'platform-tools.zip'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $sdk -Force
          }
          "ADB_PATH=$adb" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify device and process registered links
        shell: cmd
        run: node scripts/adb/ci-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adb-price-summary-${{ github.run_id }}
          path: artifacts/adb/automation/ci-summary.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.mode == 'screen' || inputs.mode == 'login_prepare')
        with:
          name: encrypted-adb-evidence-${{ github.run_id }}
          path: artifacts/adb/automation/evidence.enc.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'login_prepare'
        with:
          name: whisky-login-public-key-${{ github.run_id }}
          path: artifacts/adb/automation/login-public-key.json
          if-no-files-found: warn
          retention-days: 1
